variables:
  componentName: 'front_test'
  NU: 'NU0139001'
  cliProjectName: '$(NU)_SAF_MR_Test'
  subComponentName: 'SAF_front_Manual'
  repo: 'SAF_MR_Test'

trigger:
  branches:
    include:
      - refs/heads/trunk
      - feature/*
  paths:
    include:
      - 'front_test/*'

name: $(Build.SourceBranchName).$(date:yyyyMMdd)$(rev:.r)

resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/trunk

jobs:
  - job: Phase_1
    displayName: Gradle Compilation CD
    cancelTimeoutInMinutes: 1
    pool:
      name: Build
      demands: java
    steps:
      - checkout: self
        clean: true
        persistCredentials: True

      - task: SonarQubePrepare@8
        displayName: 'Prepare analysis on SonarQube'
        inputs:
          SonarQube: 4d8b9639-7117-44e4-90ed-1ade1b5f4376
          scannerMode: CLI
          configMode: manual
          cliProjectKey: '$(cliProjectName)_$(componentName)'
          cliProjectName: '$(cliProjectName)_$(componentName)'
          cliProjectVersion: '$(Build.BuildNumber)'
          cliSources: '$(componentName)/$(subComponentName)'
          extraProperties: |
            sonar.language=java
            sonar.sourceEncoding=UTF-8
            sonar.java.binaries=$(componentName)/$(subComponentName)/build/classes
            sonar.exclusions = **/*.gradle, **/*.json, **/*.xml, **/*.yaml

      - task: Gradle@4
        displayName: gradlew build
        inputs:
          gradleWrapperFile: '$(componentName)/$(subComponentName)/gradlew'
          workingDirectory: '$(componentName)/$(subComponentName)'
          tasks: 'clean build -x test'
          publishJUnitResults: false
          jdkVersionOption: 1.17
        continueOnError: false

      - script: |
          set -e
          mkdir -p "$(componentName)/$(subComponentName)/build/classes"
        displayName: 'Asegurar directorios para Sonar'

      - task: SonarQubeAnalyze@8
        displayName: 'Run Code Analysis'

      - task: sonar-buildbreaker@8
        displayName: 'Break build on quality gate failure'
        inputs:
          SonarQube: 4d8b9639-7117-44e4-90ed-1ade1b5f4376

      - task: CopyFiles@2
        displayName: 'Copy Files'
        inputs:
          SourceFolder: '$(componentName)/$(subComponentName)'
          Contents: |
            gradlew
            gradlew.bat
            gradle/**
            src/**
            ci/**
            build.gradle
            settings.gradle
            !**/node_modules/**
            !**/.gradle/**
            !target\**
            !build\**
            !.git\**
            !*\Documentos_de_pruebas\**
            !ManualTest/**
            !evidences/**
            !history/**
          TargetFolder: '$(build.artifactstagingdirectory)'
          CleanTargetFolder: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: $(cliProjectName)'
        inputs:
          PathtoPublish: '$(componentName)/$(subComponentName)'
          ArtifactName: 'NU0139001_SAF_MR_Test_front_manual_test_E2E_Artifact'
