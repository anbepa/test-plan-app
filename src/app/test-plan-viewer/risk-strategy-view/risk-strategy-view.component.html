<div class="risk-page">
  <!-- TOPBAR sticky -->
  <div class="page-topbar">
    <div class="breadcrumb-row">
      <button type="button" class="breadcrumb-button" (click)="goToPlansList()" [disabled]="uiLocked">← Lista de Planes</button>
      <span class="breadcrumb-separator">/</span>
      <button type="button" class="breadcrumb-button breadcrumb-link" (click)="goToPlanDetail()" [disabled]="uiLocked">Detalle del Plan</button>
      <span class="breadcrumb-separator">/</span>
      <button type="button" class="breadcrumb-button breadcrumb-current" (click)="goToCurrentPage()" [disabled]="uiLocked">Riesgos del Plan</button>
    </div>
    <div class="topbar-actions">
      <button class="btn-action btn-ai" [disabled]="uiLocked" (click)="generateWithAI()">
        <span *ngIf="loadingAI" class="spinner-inline spinner-purple"></span>
        <span *ngIf="!loadingAI" class="ai-icon" aria-hidden="true">✦</span>
        {{ loadingAI ? 'Generando...' : 'Generar con IA' }}
      </button>
      <button class="btn-action btn-primary" [disabled]="uiLocked" (click)="save()">
        <span *ngIf="isSaving" class="spinner-inline"></span>
        {{ isSaving ? 'Guardando...' : 'Guardar' }}
      </button>
      <span *ngIf="errorAI" class="error-inline">⚠️ {{ errorAI }}</span>
    </div>
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando riesgos...</p>
  </div>

  <div *ngIf="!isLoading" class="risk-card">
    <fieldset class="risk-form-shell" [disabled]="uiLocked">

    <!-- ── DESCRIPCIÓN DEL RIESGO ── -->
    <h3 class="risk-subtitle">DESCRIPCIÓN DEL RIESGO</h3>
    <div class="risk-grid risk-grid-3">

      <div class="field-group">
        <div class="field-label-row">
          <label>Probabilidad de: <span class="req">*</span></label>
        </div>
        <div class="input-with-copy">
          <textarea [(ngModel)]="riskData.probabilidadDe" placeholder="Evento" class="field-input field-textarea"
            rows="1" (input)="autoResize($event)" (focus)="autoResize($event)"></textarea>
          <button type="button" class="copy-icon-btn"
            (click)="copyField(riskData.probabilidadDe, 'probabilidadDe')"
            [disabled]="!riskData.probabilidadDe.trim()"
            [class.copied]="copiedFieldKey === 'probabilidadDe'"
            [attr.aria-label]="copiedFieldKey === 'probabilidadDe' ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'probabilidadDe' ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'probabilidadDe'" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'probabilidadDe'" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label-row">
          <label>Puede ocurrir: <span class="req">*</span></label>
        </div>
        <div class="input-with-copy">
          <textarea [(ngModel)]="riskData.puedeOcurrir" placeholder="Causa" class="field-input field-textarea"
            rows="1" (input)="autoResize($event)" (focus)="autoResize($event)"></textarea>
          <button type="button" class="copy-icon-btn"
            (click)="copyField(riskData.puedeOcurrir, 'puedeOcurrir')"
            [disabled]="!riskData.puedeOcurrir.trim()"
            [class.copied]="copiedFieldKey === 'puedeOcurrir'"
            [attr.aria-label]="copiedFieldKey === 'puedeOcurrir' ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'puedeOcurrir' ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'puedeOcurrir'" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'puedeOcurrir'" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label-row">
          <label>Lo que podría ocasionar: <span class="req">*</span></label>
        </div>
        <div class="input-with-copy">
          <textarea [(ngModel)]="riskData.loQuePodriaOcasionar" placeholder="Consecuencia" class="field-input field-textarea"
            rows="1" (input)="autoResize($event)" (focus)="autoResize($event)"></textarea>
          <button type="button" class="copy-icon-btn"
            (click)="copyField(riskData.loQuePodriaOcasionar, 'loQuePodriaOcasionar')"
            [disabled]="!riskData.loQuePodriaOcasionar.trim()"
            [class.copied]="copiedFieldKey === 'loQuePodriaOcasionar'"
            [attr.aria-label]="copiedFieldKey === 'loQuePodriaOcasionar' ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'loQuePodriaOcasionar' ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'loQuePodriaOcasionar'" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'loQuePodriaOcasionar'" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
      </div>

    </div>

    <!-- ── CLASIFICACIÓN DEL RIESGO ── -->
    <h3 class="risk-subtitle">CLASIFICACIÓN DEL RIESGO</h3>
    <div class="risk-grid risk-grid-2">

      <div class="field-group">
        <div class="field-label-row">
          <label>Impacto <span class="req">*</span></label>
          <button type="button" class="copy-icon-btn copy-icon-btn--inline"
            (click)="copyField(riskData.impacto, 'impacto')"
            [disabled]="!riskData.impacto.trim()"
            [class.copied]="copiedFieldKey === 'impacto'"
            [attr.aria-label]="copiedFieldKey === 'impacto' ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'impacto' ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'impacto'" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'impacto'" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
        <select [(ngModel)]="riskData.impacto" class="field-input">
          <option value="">Seleccione una opción</option>
          <option *ngFor="let opt of impactOptions" [value]="opt">{{ opt }}</option>
        </select>
      </div>

      <div class="field-group">
        <div class="field-label-row">
          <label>Probabilidad <span class="req">*</span></label>
          <button type="button" class="copy-icon-btn copy-icon-btn--inline"
            (click)="copyField(riskData.probabilidad, 'probabilidad')"
            [disabled]="!riskData.probabilidad.trim()"
            [class.copied]="copiedFieldKey === 'probabilidad'"
            [attr.aria-label]="copiedFieldKey === 'probabilidad' ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'probabilidad' ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'probabilidad'" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'probabilidad'" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
        <select [(ngModel)]="riskData.probabilidad" class="field-input">
          <option value="">Seleccione una opción</option>
          <option *ngFor="let opt of probabilityOptions" [value]="opt">{{ opt }}</option>
        </select>
      </div>

    </div>

    <!-- ── PLAN DE MITIGACIÓN ── -->
    <h3 class="risk-subtitle">PLAN DE MITIGACIÓN</h3>

    <div class="scenarios-block">
      <h4>Escenarios Positivos (mínimo 2)</h4>
      <div *ngFor="let sc of riskData.positiveScenarios; let i = index" class="field-group">
        <div class="field-label-row">
          <label>Escenario positivo {{ i + 1 }} con el que cubres el riesgo:</label>
          <button type="button" class="copy-icon-btn copy-icon-btn--inline"
            (click)="copyField(riskData.positiveScenarios[i], 'pos-' + i)"
            [disabled]="!riskData.positiveScenarios[i].trim()"
            [class.copied]="copiedFieldKey === 'pos-' + i"
            [attr.aria-label]="copiedFieldKey === 'pos-' + i ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'pos-' + i ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'pos-' + i" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'pos-' + i" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
        <div class="scenario-row">
          <select [(ngModel)]="riskData.positiveScenarios[i]" class="field-input">
            <option value="">Seleccione un escenario</option>
            <option *ngFor="let opt of getScenarioOptions(riskData.positiveScenarios, i)" [value]="opt">{{ opt }}</option>
          </select>
          <button type="button" class="btn btn-icon btn-secondary"
            *ngIf="riskData.positiveScenarios.length > 2"
            (click)="removePositiveScenario(i)">−</button>
        </div>
      </div>
      <button type="button" class="btn-link-add" (click)="addPositiveScenario()">Agregar</button>
    </div>

    <div class="scenarios-block">
      <h4>Escenarios Alternos (mínimo 1)</h4>
      <div *ngFor="let sc of riskData.alternateScenarios; let i = index" class="field-group">
        <div class="field-label-row">
          <label>Escenario alterno {{ i + 1 }} con el que cubres el riesgo:</label>
          <button type="button" class="copy-icon-btn copy-icon-btn--inline"
            (click)="copyField(riskData.alternateScenarios[i], 'alt-' + i)"
            [disabled]="!riskData.alternateScenarios[i].trim()"
            [class.copied]="copiedFieldKey === 'alt-' + i"
            [attr.aria-label]="copiedFieldKey === 'alt-' + i ? 'Copiado' : 'Copiar'"
            [title]="copiedFieldKey === 'alt-' + i ? 'Copiado' : 'Copiar'">
            <svg *ngIf="copiedFieldKey !== 'alt-' + i" class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg *ngIf="copiedFieldKey === 'alt-' + i" class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        </div>
        <div class="scenario-row">
          <select [(ngModel)]="riskData.alternateScenarios[i]" class="field-input">
            <option value="">Seleccione un escenario</option>
            <option *ngFor="let opt of getScenarioOptions(riskData.alternateScenarios, i)" [value]="opt">{{ opt }}</option>
          </select>
          <button type="button" class="btn btn-icon btn-secondary"
            *ngIf="riskData.alternateScenarios.length > 1"
            (click)="removeAlternateScenario(i)">−</button>
        </div>
      </div>
      <button type="button" class="btn-link-add" (click)="addAlternateScenario()">Agregar</button>
    </div>

    </fieldset>

  </div>
</div>
