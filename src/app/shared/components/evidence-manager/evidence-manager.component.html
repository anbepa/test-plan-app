<div class="evidence-manager">
  <!-- Botón único de entrada -->
  <button
    class="btn-evidence-manager"
    (click)="openModal()"
    [disabled]="isProcessing"
    [attr.aria-busy]="isProcessing"
    aria-haspopup="dialog"
    [attr.aria-expanded]="showModal"
    [title]="isProcessing ? processingMessage : 'Descargar evidencias o publicarlas en DevOps'"
    type="button">
    <ng-container *ngIf="!isProcessing">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px" aria-hidden="true">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Gestionar evidencias
    </ng-container>
    <ng-container *ngIf="isProcessing">
      <span class="btn-spinner" aria-hidden="true"></span>
      {{ processingMessage }}
    </ng-container>
  </button>

  <!-- Modal unificado -->
  <div class="evidence-modal-backdrop" *ngIf="showModal" (click)="closeModal()">
    <div
      class="evidence-modal"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-labelledby="evidence-modal-title"
      [attr.aria-busy]="isBusy">

      <!-- Header -->
      <div class="evidence-modal-header">
        <div class="evidence-modal-titlebar">
          <div class="evidence-modal-heading">
            <h3 id="evidence-modal-title">Gestionar evidencias</h3>
          </div>
          <button class="close-btn" (click)="closeModal()" type="button" aria-label="Cerrar" [disabled]="isBusy"
            [title]="isBusy ? 'Espera a que finalice el proceso en curso' : 'Cerrar (Esc)'">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <!-- Body -->
      <div class="evidence-modal-body">

        <!-- Publicar en DevOps: Word / Excel / PDF -->
        <section class="ev-section" aria-label="Publicar evidencias en DevOps">
          <div class="plan-id-field">
            <label for="evidence-plan-id" class="plan-id-label">ID del Plan de Pruebas</label>
            <div class="plan-id-inputs">
              <input
                id="evidence-plan-id"
                class="plan-id-input"
                type="text"
                inputmode="numeric"
                placeholder="Ej: 7695070"
                [(ngModel)]="up.inputPlanId"
                [disabled]="up.isValidating || isBusy"
                autocomplete="off" />
              <button
                *ngIf="up.planValidated"
                type="button"
                class="plan-id-change"
                (click)="changePlan()"
                [disabled]="isBusy">Cambiar</button>
            </div>
            <p class="plan-id-hint" *ngIf="up.planValidated">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
              Plan validado: <strong>{{ up.validatedPlan?.planTitle }}</strong>
            </p>
            <p class="plan-id-hint muted" *ngIf="!up.planValidated">
              Necesario para <strong>publicar en DevOps</strong>.
            </p>
          </div>

          <div class="zip-name-field">
            <label for="evidence-zip-name" class="plan-id-label">Nombre del archivo (.zip)</label>
            <input
              id="evidence-zip-name"
              class="plan-id-input"
              type="text"
              placeholder="Evidencia_7695070.zip"
              [(ngModel)]="up.inputFileName"
              [disabled]="isBusy"
              autocomplete="off" />
          </div>

          <div class="formats-field">
            <span class="plan-id-label">Formatos a incluir</span>
            <div class="format-checks">
              <label class="format-check">
                <input type="checkbox" [(ngModel)]="up.selectedFormats.docx" [disabled]="isBusy" />
                <span class="format-check-name"><span class="format-dot word"></span>Word (.docx)</span>
              </label>
              <label class="format-check">
                <input type="checkbox" [(ngModel)]="up.selectedFormats.excel" [disabled]="isBusy" />
                <span class="format-check-name"><span class="format-dot excel"></span>Excel (.xlsx)</span>
              </label>
              <label class="format-check">
                <input type="checkbox" [(ngModel)]="up.selectedFormats.pdf" [disabled]="isBusy" />
                <span class="format-check-name"><span class="format-dot pdf"></span>PDF (.pdf)</span>
              </label>
            </div>
            <button type="button" class="opt-btn primary publish-btn" (click)="publishOfficeFormats()"
              [disabled]="isBusy || !up.hasSelectedFormat() || !up.inputPlanId.trim()"
              [title]="!up.inputPlanId.trim() ? 'Ingresa el ID del Plan de Pruebas' : (!up.hasSelectedFormat() ? 'Selecciona al menos un formato' : 'Publicar los formatos seleccionados en DevOps')">
              Publicar en DevOps
            </button>
          </div>
        </section>

        <div class="ev-divider" role="separator"></div>

        <!-- Reporte Serenity -->
        <section class="ev-section serenity-section" aria-label="Reporte Serenity">
          <div class="format-info">
            <span class="format-icon serenity" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 4-5"/>
              </svg>
            </span>
            <span class="format-text">
              <strong>Reporte Serenity</strong>
              <small>Asíncrono · se empaqueta de forma independiente</small>
            </span>
          </div>
          <div class="zip-name-field">
            <label for="serenity-zip-name" class="plan-id-label">Nombre del archivo (.zip)</label>
            <input
              id="serenity-zip-name"
              class="plan-id-input"
              type="text"
              placeholder="Reporte_Serenity.zip"
              [(ngModel)]="up.serenityFileName"
              [disabled]="isBusy"
              autocomplete="off" />
          </div>
          <button type="button" class="opt-btn primary publish-btn" (click)="publishSerenity()"
            [disabled]="isBusy || !up.serenityFileName.trim() || !up.inputPlanId.trim()"
            title="Publicar el reporte Serenity en DevOps (usa el ID de plan ya digitado)">
            Publicar en DevOps
          </button>
        </section>

        <div class="ev-divider" role="separator"></div>

        <!-- Descargar -->
        <section class="ev-section" aria-label="Descargar evidencias">
          <span class="plan-id-label">Descargar</span>
          <div class="download-btns">
            <button type="button" class="opt-btn" (click)="downloadWord()"
              [disabled]="isBusy || !execution"
              [class.is-loading]="downloadingFormat === 'word'"
              [title]="!execution ? 'No hay una ejecución cargada' : 'Descargar en Word (.docx)'">
              <span class="opt-spinner" *ngIf="downloadingFormat === 'word'" aria-hidden="true"></span>
              Word
            </button>
            <button type="button" class="opt-btn" (click)="downloadExcel()"
              [disabled]="isBusy || !execution"
              [class.is-loading]="downloadingFormat === 'excel'"
              [title]="!execution ? 'No hay una ejecución cargada' : 'Descargar en Excel (.xlsx)'">
              <span class="opt-spinner" *ngIf="downloadingFormat === 'excel'" aria-hidden="true"></span>
              Excel
            </button>
            <button type="button" class="opt-btn" (click)="downloadPDF()"
              [disabled]="isBusy || !execution"
              [class.is-loading]="downloadingFormat === 'pdf'"
              [title]="!execution ? 'No hay una ejecución cargada' : 'Descargar en PDF'">
              <span class="opt-spinner" *ngIf="downloadingFormat === 'pdf'" aria-hidden="true"></span>
              PDF
            </button>
          </div>
        </section>
      </div>

      <!-- Aviso persistente mientras hay un proceso en curso -->
      <div class="evidence-modal-processing" *ngIf="isBusy" role="status" aria-live="polite">
        <span class="btn-spinner dark" aria-hidden="true"></span>
        <span>{{ processingMessage || 'Procesando...' }} No cierres esta ventana.</span>
      </div>

      <!-- Subcomponentes embebidos (ocultos): reutilizan la lógica sin duplicarla -->
      <div class="evidence-hidden-logic" aria-hidden="true">
        <app-evidence-download-modal
          #down
          [embedded]="true"
          [isOpen]="true"
          [execution]="execution"
          [testRun]="testRun"
          [huData]="huData"
          (closeRequested)="closeModal()"
          (openSerenityHistoryRequested)="handleOpenSerenityHistory()">
        </app-evidence-download-modal>

        <app-evidence-upload-modal
          #up
          [embedded]="true"
          [execution]="execution"
          [testRun]="testRun"
          [huData]="huData"
          (onClose)="closeModal()"
          (onProcessing)="setProcessing($event)"
          (openSerenityHistoryRequested)="handleOpenSerenityHistory()"
          (planValidatedEvent)="handlePlanValidated($event)">
        </app-evidence-upload-modal>
      </div>

    </div>
  </div>
</div>
