<div class="evidence-manager">
  <!-- Botón único de entrada -->
  <button
    class="btn-evidence-manager"
    (click)="openModal()"
    [disabled]="isProcessing"
    type="button">
    <ng-container *ngIf="!isProcessing">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Gestionar evidencias
    </ng-container>
    <ng-container *ngIf="isProcessing">
      <span class="btn-spinner"></span>
      {{ processingMessage }}
    </ng-container>
  </button>

  <!-- Modal unificado -->
  <div class="evidence-modal-backdrop" *ngIf="showModal" (click)="closeModal()">
    <div class="evidence-modal" (click)="$event.stopPropagation()">

      <!-- Header con tabs -->
      <div class="evidence-modal-header">
        <div class="evidence-modal-titlebar">
          <h3>Gestionar evidencias</h3>
          <button class="close-btn" (click)="closeModal()" type="button" aria-label="Cerrar" [disabled]="isProcessing">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div class="evidence-tabs" role="tablist">
          <button
            class="evidence-tab"
            role="tab"
            [class.active]="activeTab === 'download'"
            [disabled]="isProcessing"
            (click)="selectTab('download')"
            type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Descargar
          </button>
          <button
            class="evidence-tab"
            role="tab"
            [class.active]="activeTab === 'upload'"
            [disabled]="isProcessing"
            (click)="selectTab('upload')"
            type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Subir a Azure DevOps
          </button>
          <span class="evidence-tab-indicator" [class.upload]="activeTab === 'upload'"></span>
        </div>
      </div>

      <!-- Body: contenido de la pestaña activa -->
      <div class="evidence-modal-body">
        <app-evidence-download-modal
          *ngIf="activeTab === 'download'"
          [embedded]="true"
          [isOpen]="true"
          [execution]="execution"
          [testRun]="testRun"
          [huData]="huData"
          (closeRequested)="closeModal()"
          (openSerenityHistoryRequested)="handleOpenSerenityHistory()">
        </app-evidence-download-modal>

        <app-evidence-upload-modal
          *ngIf="activeTab === 'upload'"
          [embedded]="true"
          [execution]="execution"
          [testRun]="testRun"
          [huData]="huData"
          [prefillPlanId]="lastValidatedPlanId"
          (onClose)="closeModal()"
          (onProcessing)="setProcessing($event)"
          (openSerenityHistoryRequested)="handleOpenSerenityHistory()"
          (planValidatedEvent)="handlePlanValidated($event)">
        </app-evidence-upload-modal>
      </div>

    </div>
  </div>
</div>
