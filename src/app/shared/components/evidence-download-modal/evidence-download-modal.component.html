<div class="evidence-download-modal-backdrop" *ngIf="isOpen" (click)="closeModal()">
  <div class="evidence-download-modal" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="modal-header">
      <h3>Descargar evidencias</h3>
      <button class="close-btn" (click)="closeModal()" type="button" aria-label="Cerrar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <div class="download-options">

        <!-- Word -->
        <button class="download-option-btn" (click)="downloadWord()"
          [disabled]="isDownloading || !execution"
          [class.is-loading]="isDownloading && downloadingFormat === 'word'"
          type="button">
          <span class="opt-icon opt-icon-word">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="16" y2="17"/>
            </svg>
          </span>
          <div class="opt-content">
            <span class="opt-title">Word (DOCX)</span>
            <span class="opt-desc">Documento con estructura personalizada</span>
          </div>
          <span class="opt-chevron" *ngIf="!(isDownloading && downloadingFormat === 'word')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          </span>
          <span class="opt-spinner" *ngIf="isDownloading && downloadingFormat === 'word'"></span>
        </button>

        <!-- PDF -->
        <button class="download-option-btn" (click)="downloadPDF()"
          [disabled]="isDownloading || !execution"
          [class.is-loading]="isDownloading && downloadingFormat === 'pdf'"
          type="button">
          <span class="opt-icon opt-icon-pdf">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="8" y1="13" x2="16" y2="13"/>
              <line x1="8" y1="17" x2="13" y2="17"/>
            </svg>
          </span>
          <div class="opt-content">
            <span class="opt-title">PDF</span>
            <span class="opt-desc">Matriz de evidencias en formato PDF</span>
          </div>
          <span class="opt-chevron" *ngIf="!(isDownloading && downloadingFormat === 'pdf')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          </span>
          <span class="opt-spinner" *ngIf="isDownloading && downloadingFormat === 'pdf'"></span>
        </button>

        <!-- Serenity -->
        <button class="download-option-btn" (click)="downloadSerenity()"
          [disabled]="isDownloading || !execution"
          [class.is-loading]="isDownloading && downloadingFormat === 'serenity'"
          type="button">
          <span class="opt-icon opt-icon-serenity">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </span>
          <div class="opt-content">
            <span class="opt-title">Reporte Serenity</span>
            <span class="opt-desc">Generado por workflow (asíncrono)</span>
          </div>
          <span class="opt-chevron" *ngIf="!(isDownloading && downloadingFormat === 'serenity')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
          </span>
          <span class="opt-spinner" *ngIf="isDownloading && downloadingFormat === 'serenity'"></span>
        </button>

      </div>

      <!-- Progreso -->
      <div class="download-progress" *ngIf="isDownloading">
        <p class="progress-message">{{ downloadProgressMessage }}</p>
        <div class="progress-bar-container" *ngIf="downloadProgressPercent > 0">
          <div class="progress-bar-fill" [style.width.%]="downloadProgressPercent"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()" type="button" [disabled]="isDownloading">Cerrar</button>
    </div>

  </div>
</div>
