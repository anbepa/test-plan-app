<ng-container *ngIf="!embedded; else embeddedBody">
  <div class="evidence-download-modal-backdrop" *ngIf="isOpen" (click)="closeModal()">
    <div class="evidence-download-modal" (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="modal-header">
        <h3>Descargar evidencias</h3>
        <button class="close-btn" (click)="closeModal()" type="button" aria-label="Cerrar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <ng-container *ngTemplateOutlet="embeddedBody"></ng-container>
    </div>
  </div>
</ng-container>

<ng-template #embeddedBody>
    <!-- Body -->
    <div class="modal-body">

      <!-- Fila de acciones agrupadas -->
      <div class="download-actions-row">

        <!-- Menú único: Descargar (DOCX / PDF / Excel) -->
        <div class="download-menu" (click)="$event.stopPropagation()">
          <button
            class="action-btn primary"
            type="button"
            (click)="toggleDownloadMenu()"
            [disabled]="isDownloading || !execution"
            [attr.aria-expanded]="downloadMenuOpen"
            aria-haspopup="menu"
            [title]="!execution ? 'No hay una ejecución cargada' : 'Descargar evidencias en DOCX, PDF o Excel'">
            <span class="opt-spinner" *ngIf="isDownloading && downloadingFormat !== 'serenity'" aria-hidden="true"></span>
            <svg *ngIf="!(isDownloading && downloadingFormat !== 'serenity')" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>{{ (isDownloading && downloadingFormat !== 'serenity') ? (downloadProgressMessage || 'Generando...') : 'Descargar' }}</span>
            <svg class="caret" *ngIf="!isDownloading" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <!-- Menú desplegable -->
          <div class="download-menu-list" role="menu" *ngIf="downloadMenuOpen && !isDownloading">
            <button class="menu-item" role="menuitem" type="button" (click)="pickDownload('word')">
              <span class="opt-icon opt-icon-word" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>
                </svg>
              </span>
              <span class="menu-item-text">Word <small>(.docx)</small></span>
            </button>
            <button class="menu-item" role="menuitem" type="button" (click)="pickDownload('pdf')">
              <span class="opt-icon opt-icon-pdf" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>
                </svg>
              </span>
              <span class="menu-item-text">PDF</span>
            </button>
            <button class="menu-item" role="menuitem" type="button" (click)="pickDownload('excel')">
              <span class="opt-icon opt-icon-excel" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="19"/><line x1="16" y1="13" x2="8" y2="19"/>
                </svg>
              </span>
              <span class="menu-item-text">Excel <small>(.xlsx)</small></span>
            </button>
          </div>
        </div>

        <!-- Reporte Serenity (asíncrono) -->
        <button
          type="button"
          class="action-btn secondary"
          (click)="downloadSerenity()"
          [title]="!execution ? 'No hay una ejecución cargada' : 'Generar reporte Serenity en el pipeline de Azure DevOps'"
          [attr.aria-busy]="isDownloading && downloadingFormat === 'serenity'"
          [disabled]="(isDownloading && downloadingFormat !== 'serenity') || !execution"
          [class.is-loading]="isDownloading && downloadingFormat === 'serenity'">
          <span class="opt-spinner" *ngIf="isDownloading && downloadingFormat === 'serenity'" aria-hidden="true"></span>
          <svg *ngIf="!(isDownloading && downloadingFormat === 'serenity')" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>
            <ng-container *ngIf="isDownloading && downloadingFormat === 'serenity'">{{ serenityStatusMessage || 'Preparando...' }}</ng-container>
            <ng-container *ngIf="!(isDownloading && downloadingFormat === 'serenity')">Reporte Serenity</ng-container>
          </span>
        </button>

        <!-- Consultar reportes generados -->
        <button
          type="button"
          class="action-btn ghost"
          (click)="openSerenityHistory()"
          title="Consultar el estado y descargar el último reporte generado"
          [disabled]="isDownloading">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Ver reportes</span>
        </button>
      </div>

      <!-- Mensaje post-dispatch Serenity -->
      <div class="serenity-dispatched-msg" *ngIf="serenityDispatched" role="status" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        <span>Enviado al pipeline de Azure.
          <button type="button" class="ver-reporte-link" (click)="openSerenityHistory()">Ver reporte</button>
        </span>
      </div>

      <!-- Progreso (solo Word/PDF/Excel) -->
      <div class="download-progress" *ngIf="isDownloading && downloadingFormat !== 'serenity'" role="status" aria-live="polite">
        <div class="progress-head">
          <p class="progress-message">{{ downloadProgressMessage }}</p>
          <span class="progress-percent" *ngIf="downloadProgressPercent > 0">{{ downloadProgressPercent }}%</span>
        </div>
        <div class="progress-bar-container"
          role="progressbar"
          [attr.aria-valuenow]="downloadProgressPercent > 0 ? downloadProgressPercent : null"
          aria-valuemin="0"
          aria-valuemax="100">
          <div class="progress-bar-fill" *ngIf="downloadProgressPercent > 0" [style.width.%]="downloadProgressPercent"></div>
          <div class="progress-bar-indeterminate" *ngIf="downloadProgressPercent === 0"></div>
        </div>
      </div>

      <div class="modal-close-row" *ngIf="!embedded">
        <button class="btn-cancel" (click)="closeModal()" type="button" [disabled]="isDownloading">Cerrar</button>
      </div>
    </div>
</ng-template>
